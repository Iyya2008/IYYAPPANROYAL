<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhanlaxmi Motors Attendance</title>
    <!-- Live Mobile QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding: 15px; background: #f4f6f9; color: #333; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 6px 15px rgba(0,0,0,0.1); max-width: 400px; margin: 10px auto; }
        
        /* Header Logo Section */
        .shop-header { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .mechanic-logo { width: 45px; height: 45px; }
        .shop-header h2 { color: #0056b3; font-size: 18px; margin: 0; text-transform: uppercase; font-weight: 800; }

        input { width: 85%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        .btn { background: #28a745; color: white; padding: 14px 28px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 90%; margin-top: 10px; }
        .btn-blue { background: #007bff; }
        
        #status { margin: 15px auto; font-weight: bold; padding: 12px; border-radius: 10px; font-size: 14px; display: none; }
        #reader { width: 100%; max-width: 320px; margin: 15px auto; border-radius: 8px; overflow: hidden; display: none; }

        /* Login Verified Badge */
        .login-verified-badge { display: none; background: #e7f1ff; color: #0c5460; padding: 8px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 15px; }
        .blue-tick { color: #0d6efd; font-size: 16px; margin-left: 5px; }

        /* GPay Style Green Tick Animation */
        .success-checkmark { display: none; margin: 10px auto 20px auto; width: 80px; height: 80px; }
        .check-icon {
            width: 80px; height: 80px; border-radius: 50%; display: block;
            stroke-width: 3; stroke: #fff; stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #28a745;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }
        .check-icon .circle {
            stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 3;
            stroke-miterlimit: 10; stroke: #28a745; fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .check-icon .check {
            transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }
        @keyframes stroke { 100% { stroke-dashoffset: 0; } }
        @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
        @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 40px #28a745; } }
    </style>
</head>
<body>

    <div class="card">
        <!-- Mechanic Logo & Shop Name -->
        <div class="shop-header">
            <img src="https://cdn-icons-png.flaticon.com/512/1995/1995429.png" class="mechanic-logo" alt="Mechanic Logo">
            <h2>DHANLAXMI MOTORS</h2>
        </div>

        <!-- Permanent Login Verified Badge (Blue Tick) -->
        <div id="verifiedBadge" class="login-verified-badge">
            📱 Device Registered <span class="blue-tick">✔</span>
        </div>

        <p style="font-size: 13px; color: #666; margin-top: 0;">Mobile Attendance System</p>

        <!-- 1. FIRST TIME OTP LOGIN SECTION -->
        <div id="otpSection">
            <h3 style="font-size: 15px; color: #333;">One Time Registration</h3>
            <input type="tel" id="regMobile" placeholder="Enter Mobile Number" maxlength="10"><br>
            <button id="sendOtpBtn" class="btn btn-blue" onclick="sendOTP()">Send OTP</button>
            
            <div id="otpInputDiv" style="display:none; margin-top:10px;">
                <input type="number" id="otpCode" placeholder="Enter 4-Digit OTP (1234)"><br>
                <button class="btn btn-blue" onclick="verifyOTP()">Verify & Save Device</button>
            </div>
        </div>

        <!-- GPay Style Tick Animation -->
        <div class="success-checkmark" id="checkmark">
            <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
        </div>

        <div id="status"></div>
        
        <!-- 2. ATTENDANCE FORM SECTION -->
        <div id="attendanceSection" style="display: none;">
            <input type="text" id="staffName" placeholder="Staff Name" required><br>
            <input type="tel" id="mobileNo" placeholder="Mobile Number" required><br>
            <button id="scanBtn" class="btn" onclick="startQRScanner()">Scan Office QR Code</button>
        </div>

        <div id="reader"></div>
    </div>

    <script>
        const APP_URL = "https://script.google.com/macros/s/AKfycbzoAFfX0CaQqGGVXmv-hd4VDZR3lZ9rRautX_sr9pJ0WByYk1F-RmvFJCfo1oaQO5qs3A/exec"; 
        const COOLDOWN_HOURS = 10;
        let generatedOTP = null;

        // Check if Already Logged in Permanently
        window.onload = function() {
            let savedMobile = localStorage.getItem("registered_mobile");
            if (savedMobile) {
                document.getElementById("otpSection").style.display = "none";
                document.getElementById("attendanceSection").style.display = "block";
                document.getElementById("verifiedBadge").style.display = "block";
            }
        };

        // Simulated OTP Sending
        function sendOTP() {
            let mobile = document.getElementById("regMobile").value.trim();
            if(mobile.length !== 10) { alert("சரியான 10 இலக்க மொபைல் எண்ணை உள்ளிடவும்!"); return; }
            
            generatedOTP = "1234"; // Demo OTP
            alert("OTP அனுப்பப்பட்டது! (Demo OTP: 1234)");
            document.getElementById("otpInputDiv").style.display = "block";
            document.getElementById("sendOtpBtn").style.display = "none";
        }

        // Permanent Device Registration
        function verifyOTP() {
            let enteredOTP = document.getElementById("otpCode").value.trim();
            let mobile = document.getElementById("regMobile").value.trim();

            if (enteredOTP === generatedOTP) {
                localStorage.setItem("registered_mobile", mobile); // Permanent Lock
                alert("Login வெற்றிகரமாக முடிந்தது! இந்த சாதனத்தில் பதிவு செய்யப்பட்டது.");
                location.reload();
            } else {
                alert("தவறான OTP! மீண்டும் முயற்சிக்கவும்.");
            }
        }

        function startQRScanner() {
            let name = document.getElementById("staffName").value.trim();
            let mobile = document.getElementById("mobileNo").value.trim();
            let registeredMobile = localStorage.getItem("registered_mobile");
            
            if(!name || !mobile) { 
                alert("தயவுசெய்து பெயர் மற்றும் மொபைல் எண்ணை உள்ளிடவும்!"); 
                return; 
            }

            // ===== CHECK: REGISTRATION MOBILE vs TYPED MOBILE =====
            if (mobile !== registeredMobile) {
                let errorMsg = `${name}, நீங்கள் தவறான மொபைல் எண்ணை உள்ளிட்டுள்ளீர்கள்!`;
                speakTamil(errorMsg);
                updateStatus(`⚠️ ${name}, நீங்கள் தவறான மொபைல் எண்ணை உள்ளிட்டுள்ளீர்கள்!`, "#f8d7da", "#721c24", true);
                return; // Stop Scanning
            }

            // ===== 10 HOURS LOCK CHECK =====
            let lastScanTime = localStorage.getItem("last_scan_" + mobile);
            let currentTime = new Date().getTime();

            if (lastScanTime) {
                let hoursPassed = (currentTime - parseInt(lastScanTime)) / (1000 * 60 * 60);
                if (hoursPassed < COOLDOWN_HOURS) {
                    let alertMsg = `${name}, நீங்கள் ஏற்கனவே வருகைப் பதிவேட்டில் பதிவு செய்துவிட்டீர்கள்!`;
                    speakTamil(alertMsg);
                    updateStatus(`⚠️ ${name}, நீங்கள் ஏற்கனவே வருகைப் பதிவு செய்துவிட்டீர்கள்!`, "#f8d7da", "#721c24", true);
                    return;
                }
            }

            document.getElementById("attendanceSection").style.display = "none";
            document.getElementById("reader").style.display = "block";

            const scanner = new Html5Qrcode("reader");
            scanner.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: 250 },
                (text) => {
                    scanner.stop().then(() => {
                        document.getElementById("reader").style.display = "none";
                        pushToGoogleSheet(name, mobile, text);
                    });
                },
                (err) => {}
            ).catch(err => { 
                alert("கமரா அனுமதி தேவை!"); 
                document.getElementById("attendanceSection").style.display = "block";
                document.getElementById("reader").style.display = "none";
            });
        }

        function pushToGoogleSheet(name, mobile, qr) {
            updateStatus("தகவல்கள் பதிவு செய்யப்படுகிறது...", "#e2e3e5", "#383d41", true);
            let today = new Date();

            let payload = {
                staffName: name,
                mobileNo: mobile,
                date: today.toLocaleDateString('en-GB'),
                time: today.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
                qrCode: qr
            };

            fetch(APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }).then(() => {
                localStorage.setItem("last_scan_" + mobile, new Date().getTime());
                document.getElementById("checkmark").style.display = "block";

                let textMessage = `${name}, உங்கள் வருகை, வருகை பதிவேட்டில் பதிவு செய்யப்பட்டது. நன்றி!`;
                speakTamil(textMessage);

                updateStatus("வருகை பதிவு செய்யப்பட்டது!", "#d4edda", "#155724", true);

                setTimeout(() => {
                    location.reload();
                }, 5000);
            }).catch(e => {
                updateStatus("⚠️ Sync failed.", "#f8d7da", "#721c24", true);
            });
        }

        function speakTamil(textToSpeak) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let speech = new SpeechSynthesisUtterance();
                speech.text = textToSpeak;
                speech.lang = 'ta-IN';
                speech.rate = 0.85;
                speech.pitch = 1.2;

                let voices = window.speechSynthesis.getVoices();
                let femaleVoice = voices.find(v => v.lang.includes('ta') && (v.name.includes('Google') || v.name.includes('Female') || v.name.includes('Natural'))) || voices.find(v => v.lang.includes('ta'));

                if (femaleVoice) speech.voice = femaleVoice;
                window.speechSynthesis.speak(speech);
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        function updateStatus(txt, bg, color, show) {
            let s = document.getElementById("status");
            s.innerHTML = txt; s.style.background = bg; s.style.color = color;
            s.style.display = show ? "block" : "none";
        }
    </script>
</body>
</html>
